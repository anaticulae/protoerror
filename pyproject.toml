[project]
name = "protoerror"
version = "3.20.2"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "utilo>=2.110.2,<3.0.0",
    "iamraw>=4.95.0,<5.0.0",
    "configos>=1.0.4,<2.0.0",
    "Jinja2>=3.1.6,<4.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "utilotest>=1.1.1,<2.0.0",
    "utilosafe>=1.0.0,<2.0.0",
]

[project.scripts]
findings = "protoerror.cli:main"

[project.urls]
Homepage = "https://github.com/anaticulae/protoerro"
Repository = "https://github.com/anaticulae/protoerro"

[build-system]
requires = [
    "setuptools>=82.0.1",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "protoerror",
]
exclude = [
    "tests*",
]
